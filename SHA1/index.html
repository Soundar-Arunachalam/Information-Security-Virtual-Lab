<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SHA-1 Process Demonstration - Gamified</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1 class="mb-4 text-center">SHA-1 Process Demonstration <br/><small style="font-weight:400; color:#00ffffaa;">Step-by-step, gamified!</small></h1>
    
    <div class="mb-3">
      <label for="inputMessage" class="form-label">Enter Message</label>
      <textarea
        id="inputMessage"
        class="form-control"
        rows="3"
        placeholder="Type your message here..."
        aria-label="Input message for SHA-1 hashing"
      ></textarea>
    </div>

    <div class="mb-3 text-center">
      <button id="startBtn" class="btn btn-primary">Start SHA-1 Demo</button>
    </div>

    <h3>Process and Results</h3>
    <div id="resultWindow" aria-live="polite" aria-atomic="true"></div>
  </div>
  <footer>
    Made with ❤️ by Soundar-Praveen-Sethupathy
  </footer>
  <script defer src="script.js"></script>
</body>
</html>
